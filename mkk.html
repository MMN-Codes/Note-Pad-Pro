<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>App Store Screenshot Generator</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: -apple-system, 'SF Pro Display', 'Segoe UI', Arial, sans-serif;
    background:#0b0e16;
    color:#e6e9f2;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:30px 16px 80px;
  }

  h1.pagetitle { font-size:20px; font-weight:700; margin-bottom:6px; }
  .sub { color:#8a92a8; font-size:14px; margin-bottom:26px; text-align:center; }

  /* ---------- Controls panel ---------- */
  .panel {
    width:100%;
    max-width:560px;
    background:#151a27;
    border:1px solid #262c3d;
    border-radius:16px;
    padding:20px;
    margin-bottom:28px;
  }
  .field { margin-bottom:16px; }
  .field:last-child { margin-bottom:0; }
  .field label {
    display:block;
    font-size:13px;
    color:#9aa2b8;
    margin-bottom:6px;
    font-weight:600;
  }
  .field input[type="text"] {
    width:100%;
    background:#0e121c;
    border:1px solid #2b3247;
    border-radius:10px;
    padding:11px 14px;
    color:#fff;
    font-size:15px;
  }
  .field input[type="text"]:focus { outline:none; border-color:#5b8dff; }

  .filebtn {
    display:inline-flex;
    align-items:center;
    gap:8px;
    background:#1f2740;
    border:1px solid #33405f;
    color:#cfd8f5;
    padding:10px 16px;
    border-radius:10px;
    font-size:14px;
    cursor:pointer;
    font-weight:600;
  }
  .filebtn:hover { background:#28324f; }
  input[type="file"] { display:none; }
  .filename { font-size:12px; color:#6d7690; margin-top:6px; }

  .colorrow { display:flex; gap:10px; }
  .swatch {
    width:34px; height:34px;
    border-radius:8px;
    cursor:pointer;
    border:2px solid transparent;
  }
  .swatch.active { border-color:#fff; }

  .downloadbar {
    width:100%;
    max-width:560px;
    display:flex;
    gap:12px;
    margin-bottom:36px;
  }
  .btn {
    flex:1;
    padding:15px 20px;
    border-radius:12px;
    font-size:15px;
    font-weight:700;
    border:none;
    cursor:pointer;
  }
  .btn-primary {
    background:linear-gradient(135deg,#4b93ff,#2f6bff);
    color:#fff;
    box-shadow:0 8px 24px rgba(47,107,255,0.4);
  }
  .btn-primary:hover { filter:brightness(1.08); }
  .btn-primary:disabled { opacity:0.5; cursor:default; }
  .status { font-size:13px; color:#8a92a8; text-align:center; margin-top:-20px; margin-bottom:24px; min-height:16px; }

  /* ---------- Promo card (this is what gets exported) ---------- */
  #capture-wrap {
    transform: scale(0.42);
    transform-origin: top center;
    margin-bottom:-1470px; /* compensate for scale so layout below isn't pushed down too far */
  }
  @media (max-width:600px){
    #capture-wrap{ transform: scale(0.32); margin-bottom:-1720px; }
  }

  .promo-card {
    width:1170px;
    height:2532px;
    position:relative;
    overflow:hidden;
    background: radial-gradient(ellipse 900px 700px at 50% 8%, #16305c 0%, #0b1e40 38%, #050f24 72%, #020714 100%);
  }
  .promo-card.theme-purple { background: radial-gradient(ellipse 900px 700px at 50% 8%, #3a1c5c 0%, #22103f 38%, #120926 72%, #060312 100%); }
  .promo-card.theme-green { background: radial-gradient(ellipse 900px 700px at 50% 8%, #0f4536 0%, #0a2e26 38%, #061a16 72%, #030d0b 100%); }
  .promo-card.theme-warm { background: radial-gradient(ellipse 900px 700px at 50% 8%, #5c2c1c 0%, #3f1f10 38%, #260f09 72%, #120703 100%); }

  .glow {
    position:absolute;
    top:-200px; left:50%;
    transform:translateX(-50%);
    width:1400px; height:900px;
    background:radial-gradient(ellipse at center, rgba(90,150,255,0.25) 0%, rgba(90,150,255,0) 65%);
    pointer-events:none;
  }
  .theme-purple .glow { background:radial-gradient(ellipse at center, rgba(170,110,255,0.25) 0%, rgba(170,110,255,0) 65%); }
  .theme-green .glow { background:radial-gradient(ellipse at center, rgba(60,220,160,0.22) 0%, rgba(60,220,160,0) 65%); }
  .theme-warm .glow { background:radial-gradient(ellipse at center, rgba(255,150,90,0.25) 0%, rgba(255,150,90,0) 65%); }

  .headline {
    position:relative;
    text-align:center;
    padding-top:150px;
    z-index:2;
  }
  .headline h1 {
    font-size:76px;
    line-height:1.14;
    font-weight:800;
    color:#ffffff;
    letter-spacing:-1.5px;
    text-shadow: 0 2px 30px rgba(120,170,255,0.35);
    outline:none;
    padding:0 40px;
  }
  .headline h1 .accent {
    background: linear-gradient(90deg, #7db8ff, #a78bfa);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    display:block;
  }
  .theme-purple .accent { background: linear-gradient(90deg, #c99bff, #ff9bd6); -webkit-background-clip:text; background-clip:text; }
  .theme-green .accent { background: linear-gradient(90deg, #6df0c2, #a8ff8f); -webkit-background-clip:text; background-clip:text; }
  .theme-warm .accent { background: linear-gradient(90deg, #ffb17a, #ffdd8f); -webkit-background-clip:text; background-clip:text; }

  .divider {
    display:flex;
    align-items:center;
    justify-content:center;
    gap:18px;
    margin-top:48px;
    position:relative;
    z-index:2;
  }
  .divider .line {
    width:280px; height:1px;
    background:linear-gradient(90deg, transparent, rgba(150,190,255,0.6), transparent);
  }
  .divider .star {
    width:14px; height:14px;
    background:#8fb8ff;
    clip-path: polygon(50% 0%, 61% 39%, 100% 50%, 61% 61%, 50% 100%, 39% 61%, 0% 50%, 39% 39%);
    box-shadow:0 0 24px 6px rgba(140,180,255,0.7);
  }

  .phone-wrap {
    position:relative;
    z-index:2;
    margin:70px auto 0;
    width:560px;
    display:flex;
    justify-content:center;
  }
  .phone {
    width:560px;
    height:1180px;
    background:#0a0f1e;
    border-radius:64px;
    border:8px solid #cfd3da;
    box-shadow:
      0 40px 100px rgba(0,0,0,0.55),
      0 0 0 2px rgba(255,255,255,0.05) inset;
    position:relative;
    overflow:hidden;
  }
  .notch {
    position:absolute;
    top:0; left:50%; transform:translateX(-50%);
    width:210px; height:34px;
    background:#0a0f1e;
    border-bottom-left-radius:20px;
    border-bottom-right-radius:20px;
    z-index:10;
  }
  .screen-img-wrap {
    position:absolute; inset:0;
    background:#0a1226;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .screen-img-wrap img {
    width:100%; height:100%;
    object-fit:cover;
    object-position:top center;
  }
  .placeholder-text {
    color:rgba(255,255,255,0.35);
    font-size:20px;
    text-align:center;
    padding:0 40px;
    line-height:1.5;
  }

  .footer-badge {
    position:relative;
    z-index:2;
    text-align:center;
    margin-top:60px;
    color:rgba(200,215,245,0.55);
    font-size:22px;
    letter-spacing:2px;
    text-transform:uppercase;
    font-weight:600;
    padding:0 40px;
    outline:none;
  }

  [contenteditable="true"] { cursor:text; }
  [contenteditable="true"]:hover { box-shadow: 0 0 0 2px rgba(255,255,255,0.15); border-radius:8px; }
</style>
</head>
<body>

  <h1 class="pagetitle">📱 App Store Screenshot Generator</h1>
  <p class="sub">Text edit karne ke liye seedha promo card par tap/click karein.<br>Neeche screenshot upload karein aur phir HD download karein.</p>

  <div class="panel">
    <div class="field">
      <label>Screenshot upload karein (phone screen mein fit hoga)</label>
      <label class="filebtn" for="fileInput">📁 Choose Image</label>
      <input type="file" id="fileInput" accept="image/*">
      <div class="filename" id="fileName">Koi file select nahi hui</div>
    </div>

    <div class="field">
      <label>Theme Color</label>
      <div class="colorrow">
        <div class="swatch active" data-theme="theme-blue" style="background:linear-gradient(135deg,#16305c,#050f24)"></div>
        <div class="swatch" data-theme="theme-purple" style="background:linear-gradient(135deg,#3a1c5c,#120926)"></div>
        <div class="swatch" data-theme="theme-green" style="background:linear-gradient(135deg,#0f4536,#061a16)"></div>
        <div class="swatch" data-theme="theme-warm" style="background:linear-gradient(135deg,#5c2c1c,#260f09)"></div>
      </div>
    </div>
  </div>

  <div class="downloadbar">
    <button class="btn btn-primary" id="downloadBtn">⬇️ Download HD PNG</button>
  </div>
  <div class="status" id="status"></div>

  <div id="capture-wrap">
    <div class="promo-card" id="promoCard">
      <div class="glow"></div>

      <div class="headline">
        <h1 contenteditable="true" id="headlineText">Your Notes,<br><span class="accent" contenteditable="true" id="headlineAccent">Beautifully Organized</span></h1>
      </div>

      <div class="divider">
        <div class="line"></div>
        <div class="star"></div>
        <div class="line"></div>
      </div>

      <div class="phone-wrap">
        <div class="phone">
          <div class="notch"></div>
          <div class="screen-img-wrap" id="screenImgWrap">
            <div class="placeholder-text">Apna app ka<br>screenshot yahan<br>upload karein</div>
          </div>
        </div>
      </div>

      <div class="footer-badge" contenteditable="true" id="footerText">Note Pad Pro</div>
    </div>
  </div>

<script>
  const fileInput = document.getElementById('fileInput');
  const fileName = document.getElementById('fileName');
  const screenImgWrap = document.getElementById('screenImgWrap');
  const downloadBtn = document.getElementById('downloadBtn');
  const status = document.getElementById('status');
  const promoCard = document.getElementById('promoCard');
  const swatches = document.querySelectorAll('.swatch');

  fileInput.addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;
    fileName.textContent = file.name;
    const reader = new FileReader();
    reader.onload = function(evt) {
      screenImgWrap.innerHTML = '<img src="' + evt.target.result + '" id="screenshotImg">';
    };
    reader.readAsDataURL(file);
  });

  swatches.forEach(function(sw) {
    sw.addEventListener('click', function() {
      swatches.forEach(function(s){ s.classList.remove('active'); });
      sw.classList.add('active');
      promoCard.classList.remove('theme-purple','theme-green','theme-warm');
      const theme = sw.getAttribute('data-theme');
      if (theme !== 'theme-blue') promoCard.classList.add(theme);
    });
  });

  downloadBtn.addEventListener('click', function() {
    status.textContent = 'Generating high quality image...';
    downloadBtn.disabled = true;

    // Temporarily reset transform for accurate capture at full resolution
    const wrap = document.getElementById('capture-wrap');
    const originalTransform = wrap.style.transform;
    const originalMargin = wrap.style.marginBottom;
    wrap.style.transform = 'none';
    wrap.style.marginBottom = '0';

    html2canvas(promoCard, {
      width: 1170,
      height: 2532,
      scale: 2,
      useCORS: true,
      backgroundColor: null
    }).then(function(canvas) {
      wrap.style.transform = originalTransform;
      wrap.style.marginBottom = originalMargin;

      const link = document.createElement('a');
      link.download = 'app-store-screenshot.png';
      link.href = canvas.toDataURL('image/png', 1.0);
      link.click();
      status.textContent = '✅ Downloaded! (2340 × 5064 px — high quality)';
      downloadBtn.disabled = false;
    }).catch(function(err) {
      wrap.style.transform = originalTransform;
      wrap.style.marginBottom = originalMargin;
      status.textContent = '❌ Error: ' + err.message;
      downloadBtn.disabled = false;
    });
  });
</script>
</body>
</html>
